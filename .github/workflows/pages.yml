name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Test
        run: |
          node test-game.cjs
          node test-classic.cjs
      - name: Assemble the public site
        run: |
          mkdir -p _site
          cp index.html game.js style.css pwa.js sw.js manifest.webmanifest favicon.svg NOTICE LICENSE _site/
          cp -r classic _site/
          # Each deployment gets unique asset URLs, bypassing older browser/CDN entries.
          python - <<'PY'
          import os, re
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          html = re.sub(r'(style\.css|game\.js|pwa\.js)\?v=[^"\s]+', lambda m: m.group(1) + '?v=' + os.environ['GITHUB_SHA'], html)
          page.write_text(html, encoding='utf-8')
          worker = Path('_site/sw.js')
          worker.write_text(worker.read_text(encoding='utf-8').replace('20260927-pwa', os.environ['GITHUB_SHA']), encoding='utf-8')
          classic_page = Path('_site/classic/index.html')
          classic_html = classic_page.read_text(encoding='utf-8')
          classic_html = re.sub(r'(style\.css|game\.js|pwa\.js)\?v=[^"\s]+', lambda m: m.group(1) + '?v=' + os.environ['GITHUB_SHA'], classic_html)
          classic_page.write_text(classic_html, encoding='utf-8')
          classic_worker = Path('_site/classic/sw.js')
          classic_worker.write_text(classic_worker.read_text(encoding='utf-8').replace('classic-20260929', os.environ['GITHUB_SHA']), encoding='utf-8')
          PY
          cp -r assets _site/
      - name: Add the v2 preview
        run: |
          # Preview of the BIZNES.EXE 2.0 work branch at /v2/ (rebuilt on each main deploy or manual run).
          if git fetch origin v2:refs/remotes/origin/v2; then
            mkdir -p _site/v2
            git archive origin/v2 index.html privacy.html game.js style.css pwa.js sw.js manifest.webmanifest favicon.svg NOTICE LICENSE assets data | tar -x -C _site/v2
            V2=$(git rev-parse origin/v2)
            sed -i "s/bx2-1/$V2/g" _site/v2/sw.js
            sed -i -E "s/(style\.css|game\.js|pwa\.js|data\/game-data\.js)\?v=[^\"[:space:]]+/\1?v=$V2/g" _site/v2/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
