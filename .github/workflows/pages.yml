name: Validate BIZNES.EXE 2.0
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax and gameplay
        run: |
          node --check game.js
          node --check data/game-data.js
          node test-game.cjs
          node test-classic.cjs
          node test-pwa.cjs
