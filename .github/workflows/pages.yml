name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Test
        run: |
          node test-game.cjs
          node test-classic.cjs
      - name: Assemble the public site
        run: |
          mkdir -p _site
          cp index.html privacy.html game.js style.css pwa.js sw.js manifest.webmanifest favicon.svg NOTICE LICENSE _site/
          cp -r data _site/
          cp -r classic _site/
          # Each deployment gets unique asset URLs, bypassing older browser/CDN entries.
          python - <<'PY'
          import os, re
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          html = re.sub(r'(style\.css|game\.js|pwa\.js|data/game-data\.js)\?v=[^"\s]+', lambda m: m.group(1) + '?v=' + os.environ['GITHUB_SHA'], html)
          page.write_text(html, encoding='utf-8')
          worker = Path('_site/sw.js')
          worker.write_text(worker.read_text(encoding='utf-8').replace('bx2-1', os.environ['GITHUB_SHA']), encoding='utf-8')
          privacy_page = Path('_site/privacy.html')
          privacy_page.write_text(privacy_page.read_text(encoding='utf-8').replace('style.css?v=bx2-1', 'style.css?v=' + os.environ['GITHUB_SHA']), encoding='utf-8')
          classic_page = Path('_site/classic/index.html')
          classic_html = classic_page.read_text(encoding='utf-8')
          classic_html = re.sub(r'(style\.css|game\.js|pwa\.js)\?v=[^"\s]+', lambda m: m.group(1) + '?v=' + os.environ['GITHUB_SHA'], classic_html)
          classic_page.write_text(classic_html, encoding='utf-8')
          classic_worker = Path('_site/classic/sw.js')
          classic_worker.write_text(classic_worker.read_text(encoding='utf-8').replace('classic-20260929', os.environ['GITHUB_SHA']), encoding='utf-8')
          PY
          cp -r assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
